<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Axonometra – Plan importieren</title>
    <meta name="description" content="Import a floor plan from Sweet Home 3D, an iPhone LiDAR scan (RoomPlan), CAD (DXF), Blender/SketchUp (glTF, OBJ, STL), Floorplanner or a Valetudo robot map into Axonometra for Home Assistant. Runs in your browser." />
    <style>
      :root {
        --bg: #070b14;
        --panel: #0d1628;
        --line: rgba(0, 229, 255, 0.22);
        --text: #d7ecff;
        --muted: #8fa6c4;
        --accent: #00e5ff;
        --warm: #ffb547;
        --bad: #ff6b6b;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      #app { max-width: 980px; margin: 0 auto; padding: 16px 16px 48px; }
      header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin: 8px 0 4px; }
      .brand { color: var(--accent); font-weight: 800; text-decoration: none; letter-spacing: 0.02em; text-shadow: 0 0 12px rgba(0, 229, 255, 0.5); }
      h1 { margin: 0; font-size: 22px; flex: 1; }
      .beta { display: inline-block; vertical-align: middle; margin-left: 8px; padding: 2px 9px; border-radius: 999px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: #06101c; background: #ffb547; }
      .beta-note { margin: -4px 0 14px; font-size: 13px; color: #ffb547; }
      h2 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); }
      .lead { color: var(--muted); margin: 6px 0 16px; }
      button, select, input { font: inherit; color: var(--text); background: #0a1322; border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; }
      button { cursor: pointer; }
      button:hover { border-color: var(--accent); }
      .lang { padding: 4px 12px; }
      .drop { display: grid; gap: 6px; place-items: center; text-align: center; padding: 34px 18px; border: 2px dashed var(--line); border-radius: 18px; background: var(--panel); cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s; }
      .drop:hover, .drop.over { border-color: var(--accent); box-shadow: 0 0 24px rgba(0, 229, 255, 0.18); }
      .drop.busy { opacity: 0.7; }
      .drop input { display: none; }
      .drop .big { font-size: 19px; font-weight: 700; word-break: break-all; }
      .drop .small { color: var(--muted); font-size: 13px; max-width: 760px; }
      .card { margin-top: 14px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); }
      details.card summary { cursor: pointer; color: var(--accent); font-weight: 600; }
      dl { margin: 10px 0 0; }
      dt { font-weight: 700; margin-top: 8px; }
      dd { margin: 2px 0 0; color: var(--muted); }
      a { color: var(--accent); }
      .error { margin-top: 14px; padding: 12px 14px; border: 1px solid var(--bad); border-radius: 12px; color: var(--bad); background: rgba(255, 107, 107, 0.08); }
      .summary { display: flex; flex-wrap: wrap; gap: 8px 20px; }
      .summary b { color: var(--accent); }
      .warn { border-color: rgba(255, 181, 71, 0.4); }
      .warn h2 { color: var(--warm); }
      .warn ul { margin: 0; padding-left: 18px; color: var(--muted); }
      .opts { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
      .opts label { display: inline-flex; gap: 8px; align-items: center; }
      .opts .wide { display: grid; gap: 4px; width: 100%; }
      .opts small { color: var(--muted); }
      .layers { display: grid; gap: 6px; width: 100%; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
      .layers b { grid-column: 1 / -1; }
      .layers label { justify-content: space-between; }
      .layers span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
      .tabs .on { border-color: var(--accent); color: var(--accent); }
      .plan { height: min(64vh, 560px); border-radius: 12px; background: #050913; border: 1px solid var(--line); }
      .plan svg { width: 100%; height: 100%; display: block; }
      .plan .room { fill: rgba(0, 229, 255, 0.08); stroke: var(--accent); stroke-width: 0.06; }
      .plan .wall { stroke: #6fb7ff; stroke-linecap: square; }
      .plan .door { stroke: var(--warm); stroke-width: 0.16; stroke-linecap: round; }
      .plan .win { stroke: #7cffb2; stroke-width: 0.16; stroke-linecap: round; }
      .plan .furn { fill: rgba(140, 120, 255, 0.18); stroke: rgba(170, 150, 255, 0.7); stroke-width: 0.025; }
      .plan text { fill: var(--text); text-anchor: middle; font-weight: 600; }
      .plan text.area { fill: var(--muted); font-weight: 400; }
      .legend { display: flex; gap: 8px 18px; align-items: center; color: var(--muted); font-size: 13px; margin-top: 8px; flex-wrap: wrap; }
      .legend i { display: inline-block; width: 18px; height: 4px; border-radius: 2px; vertical-align: middle; }
      .l-door { background: var(--warm); }
      .l-win { background: #7cffb2; }
      .l-furn { background: rgba(170, 150, 255, 0.7); }
      .names { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
      .names label { display: grid; grid-template-columns: 64px 1fr; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; }
      .go { text-align: center; }
      .primary { background: var(--accent); color: #031018; border: none; font-weight: 800; padding: 12px 22px; font-size: 16px; box-shadow: 0 0 22px rgba(0, 229, 255, 0.35); }
      .go p { color: var(--muted); margin: 10px 0 0; }
      footer { margin-top: 28px; color: var(--muted); font-size: 13px; text-align: center; }
      @media (max-width: 560px) {
        h1 { font-size: 18px; }
        .plan { height: 52vh; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="neonplan-import.js"></script>
  </body>
</html>
