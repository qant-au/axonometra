<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Axonometra</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #070b14;
      }
      #plan {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="plan"></div>
    <script type="module">
      // The planner on its own: the plans are kept in this browser, and there is no live data.
      // With no plan named it opens on the start page: a new plan, which is named and kept at its first save, or one
      // of the plans saved here ("Open Existing"). ?plan=<name> opens that plan, and the address follows the plan
      // being worked on. ?fresh starts an empty one in memory (nothing kept); ?ha shows the parts that need a Home
      // Assistant behind the host (off by default: there is none here); ?example=<name> opens one of the example
      // plans in memory (frontend/src/plans/examples.ts).
      import { browserPlans, memoryStore, mountAxonometra } from "./axonometra-host.js";

      const params = new URLSearchParams(location.search);
      const example = params.get("example");
      const memory = example ? memoryStore({ building: (await import("./axonometra-plans.js")).examplePlan(example).building }) : params.has("fresh") ? memoryStore() : null;
      const kept = browserPlans(params.get("plan"), (name) => {
        params.set("plan", name);
        history.replaceState(null, "", `?${params}`);
      });
      // a plan in memory offers no saved ones: opening one would not keep its edits
      window.axonometra = await mountAxonometra(document.querySelector("#plan"), {
        ...(memory ? { store: memory } : kept),
        language: params.get("lang") ?? undefined,
        homeAssistant: params.has("ha"),
      });
    </script>
  </body>
</html>
