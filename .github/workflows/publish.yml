# A release: push a v* tag matching package.json's version. Lints, tests,
# builds the library and publishes @axonometra/editor to npm with provenance,
# through npm Trusted Publishing: no token, the package trusts this workflow
# on npmjs.com.
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: The tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($expected)." >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build:lib
      # A re-pushed or re-run tag whose version is already on npm has nothing to
      # publish: succeed without publishing instead of failing on "cannot
      # publish over".
      - name: Skip when this version is already on npm
        id: published
        run: |
          spec="$(node -p "const p=require('./package.json'); p.name+'@'+p.version")"
          if [ -n "$(npm view "$spec" version 2>/dev/null)" ]; then
            echo "$spec is already on npm; nothing to publish."
            echo "already=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.already != 'true'
        run: npm install -g npm@^11.5.1
      - if: steps.published.outputs.already != 'true'
        run: npm publish --provenance --access public --ignore-scripts
