# Downloads the latest release the way HACS does (aiohttp, default limits) every few hours. A failure
# means HACS users cannot install or update right now, and GitHub mails the maintainer. Found the hard
# way: on 23 October 2026 GitHub's release redirects outgrew aiohttp's 8 KB header limit
# (hacs/integration#5643) and we only learned it from an issue the next morning.
name: HACS download check

on:
  schedule:
    - cron: "41 */4 * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q aiohttp
      - run: python tools/hacs_download_check.py
