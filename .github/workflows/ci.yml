name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Advisories are published without anyone committing; the weekly run
  # surfaces them. Monday 06:00 AEST.
  schedule:
    - cron: '0 20 * * 0'

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Blocking gate on the shipped (production) tree only. Dev tooling never
      # reaches the nginx image; gating on it would leave the job permanently red.
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npx vite build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
