# The fork's own checks, kept out of upstream's ci.yml so merges never touch them. The tree
# must already carry Axonometra's identity (fork/identity.py --check makes no changes).
name: Fork

on:
  push:
    branches: [main]
  pull_request:
  # the npm release (npm-release.yml) runs these same checks before it publishes
  workflow_call:

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python3 fork/identity.py --check

  # The engine with no Home Assistant: build it standalone and check it mounts in a headless Chrome.
  standalone:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node ../fork/build-standalone.mjs
      - run: node ../fork/smoke-standalone.mjs
      - run: node ../fork/smoke-hulls.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome

  # The npm package (@axonometra/editor), tested from its packed tarball: contents, a consumer typecheck through the
  # real exports, the standalone smoke checks against the installed package, and a bundled consumer.
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node ../fork/build-package.mjs
      - run: node ../fork/pack-test.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
